<svg viewBox="0 0 1200 58" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="shimmerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <rect x="1" y="1" width="1198" height="56" rx="10"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="56" rx="10" fill="#0A101F" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="1.2"/>

  <g clip-path="url(#bodyClip)">
    <rect x="1" y="1" width="7" height="56" fill="url(#accentGrad)"/>
    <rect x="1" y="54" width="1198" height="2.4" fill="url(#underlineGrad)" opacity="0.85"/>

    <rect x="-140" y="1" width="140" height="56" fill="url(#shimmerGrad)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 1340,0" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <circle cx="1090" cy="23.0" r="2.6" fill="#22D3EE">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.69s" begin="0.28s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1114" cy="35.0" r="2.6" fill="#A78BFA">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1138" cy="23.0" r="2.6" fill="#10B981">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.69s" begin="0.52s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="30" y="31.0" font-family="'JetBrains Mono','Fira Code',monospace" font-size="19" font-weight="700" fill="#22D3EE" dominant-baseline="middle">&gt;</text>
  <text x="52" y="31.0" font-family="'JetBrains Mono','Fira Code',monospace" font-size="21" font-weight="700" letter-spacing="1" fill="#E7E9F5" dominant-baseline="middle">SECURITY.DOMAIN</text>
  <rect x="298.5" y="18.0" width="3.2" height="22" fill="#A78BFA">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.99;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>