name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: selslim-dev
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%2322D3EE&color_dots=%232d3343,%23164E63,%230891B2,%2322D3EE,%23A78BFA
            dist/snake-light.svg?palette=github-light&color_snake=%230891B2&color_dots=%23E7E9F5,%23A5F3FC,%2322D3EE,%230891B2,%237C3AED
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
